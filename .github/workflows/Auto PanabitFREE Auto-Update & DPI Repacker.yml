name: Panabit Repack with Latest DPI  0000

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *' # 北京时间 (UTC+8) 每天 18:00 自动运行

permissions:
  contents: write

jobs:
  repack-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y p7zip-full file

      - name: Download Files and Check for Updates
        id: download
        run: python check_and_download.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack, Replace, and Repack
        if: steps.download.outputs.has_update == 'true'
        run: |
          MAIN_DIR=$(tar -ztf panabit_pkg.tar.gz | head -n 1 | cut -d'/' -f1)
          echo "主包根目录名称: $MAIN_DIR"

          tar -zxf panabit_pkg.tar.gz

          mkdir -p PDB_EXTRACTED
          7z x dpi_pkg.pdb -oPDB_EXTRACTED -y > /dev/null

          find PDB_EXTRACTED -type f | while read -r file; do
              if file "$file" | grep -q "tar archive"; then
                  tar -xf "$file" -C PDB_EXTRACTED/
              fi
          done

          DICT_SRC=$(find PDB_EXTRACTED -name "dict.so" | head -n 1)
          DPI_SRC=$(find PDB_EXTRACTED -name "dpi.so" | head -n 1)

          cp -f "$DICT_SRC" "$MAIN_DIR/bin/"
          cp -f "$DPI_SRC" "$MAIN_DIR/bin/"

          OUT_NAME="${MAIN_DIR}_x86_Linux_DPI_Updated.tar.gz"
          tar -zcf "$OUT_NAME" "$MAIN_DIR"

          echo "FINAL_PACKAGE=$OUT_NAME" >> $GITHUB_ENV
          echo "RELEASE_TAG=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

      - name: Publish to GitHub Releases
        if: steps.download.outputs.has_update == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Panabit Standard (x86/Linux) - DPI Updated ${{ env.RELEASE_TAG }}
          body: |
            Panabit 标准版 DPI 特征库自动补丁包。

            - **系统架构**: `x86/Linux (amd64)`
            - **包含替换**:
              - `bin/dict.so`
              - `bin/dpi.so`

            <!-- 用于自动判断更新的签名信息，请勿修改下方文本 -->
            COMBINED_MD5:${{ steps.download.outputs.combined_md5 }}
          draft: false
          prerelease: false
          files: ${{ env.FINAL_PACKAGE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
