name: Panabit Repack with Latest DPI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # 北京时间 (UTC+8) 每天 18:00 自动运行

permissions:
  contents: write

jobs:
  repack-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y p7zip-full file

      - name: Download Files and Check for Updates
        id: download
        run: |
          python - << 'EOF'
          import os, asyncio, requests
          from playwright.async_api import async_playwright

          async def main():
              # 1. 查询 GitHub 上一次最新 Release 的记录
              repo = os.environ.get('GITHUB_REPOSITORY')
              token = os.environ.get('GITHUB_TOKEN')
              headers_gh = {'Authorization': f'token {token}', 'Accept': 'application/vnd.github.v3+json'}
              
              last_md5_combined = ''
              rel_res = requests.get(f'https://api.github.com/repos/{repo}/releases/latest', headers=headers_gh)
              if rel_res.status_code == 200:
                  rel_body = rel_res.json().get('body', '')
                  for line in rel_body.splitlines():
                      if 'COMBINED_MD5:' in line:
                          last_md5_combined = line.split('COMBINED_MD5:')[1].strip()

              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context(accept_downloads=True, ignore_https_errors=True)

                  # 2. 获取PanabitFREE系统升级包 MD5 (在独立标签页 page1 中操作)
                  print('正在检查PanabitFREE系统升级包更新...')
                  page1 = await context.new_page()
                  await page1.goto('https://download.panabit.com:9443/?product=panabit', wait_until='networkidle')
                  standard_tab = page1.locator('text=标准版')
                  if await standard_tab.count() > 0:
                      await standard_tab.first.click()
                      await page1.wait_for_timeout(1000)

                  pkg_item1 = page1.locator('div.paui-package-item:has(h6:has-text("PanabitFREE"))')
                  md5_1_text = await pkg_item1.locator('li:has-text("MD5:")').inner_text()
                  md5_1 = md5_1_text.replace('MD5:', '').strip()

                  # 3. 获取 DPI 特征库 MD5 (在独立标签页 page2 中操作)
                  print('正在检查 DPI 特征库更新...')
                  page2 = await context.new_page()
                  await page2.goto('https://download.panabit.com:9443/dpi.php', wait_until='networkidle')
                  pkg_item2 = page2.locator('div.paui-package-item:has(h6:has-text("DPI_Linux")):has(h6:has-text("amd64"))')
                  md5_2_text = await pkg_item2.locator('li:has-text("MD5:")').inner_text()
                  md5_2 = md5_2_text.replace('MD5:', '').strip()

                  current_combined_md5 = f'{md5_1}_{md5_2}'
                  print(f'当前官方 MD5: {current_combined_md5}')
                  print(f'上次发布 MD5: {last_md5_combined}')

                  # 比对 MD5：无更新则终止任务
                  if current_combined_md5 == last_md5_combined and last_md5_combined != '':
                      print('【提示】官方未发布新版本/特征库，停止当前任务。')
                      with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                          f.write('has_update=false\n')
                      await browser.close()
                      return

                  print('检测到新版本/特征库更新，开始下载文件...')
                  
                  # 在 page1 下载PanabitFREE系统升级包
                  download1_promise = page1.wait_for_event('download')
                  await pkg_item1.locator('button:has-text("立即下载")').click()
                  download1 = await download1_promise
                  await download1.save_as('panabit_pkg.tar.gz')

                  # 在 page2 下载 DPI 特征包
                  download2_promise = page2.wait_for_event('download')
                  await pkg_item2.locator('button:has-text("立即下载")').click()
                  download2 = await download2_promise
                  await download2.save_as('dpi_pkg.pdb')

                  await browser.close()

                  # 写入输出变量
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write('has_update=true\n')
                      f.write(f'combined_md5={current_combined_md5}\n')

          asyncio.run(main())
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack, Replace, and Repack
        if: steps.download.outputs.has_update == 'true'
        run: |
          MAIN_DIR=$(tar -ztf panabit_pkg.tar.gz | head -n 1 | cut -d'/' -f1)
          echo "PanabitFREE系统升级包目录名称: $MAIN_DIR"

          tar -zxf panabit_pkg.tar.gz

          mkdir -p PDB_EXTRACTED
          7z x dpi_pkg.pdb -oPDB_EXTRACTED -y > /dev/null

          # 二次递归解压嵌套的 tar 文件
          find PDB_EXTRACTED -type f | while read -r file; do
              if file "$file" | grep -q "tar archive"; then
                  tar -xf "$file" -C PDB_EXTRACTED/
              fi
          done

          DICT_SRC=$(find PDB_EXTRACTED -name "dict.so" | head -n 1)
          DPI_SRC=$(find PDB_EXTRACTED -name "dpi.so" | head -n 1)

          cp -f "$DICT_SRC" "$MAIN_DIR/bin/"
          cp -f "$DPI_SRC" "$MAIN_DIR/bin/"

          OUT_NAME="${MAIN_DIR}_x86_Linux_DPI_Updated.tar.gz"
          tar -zcf "$OUT_NAME" "$MAIN_DIR"

          echo "FINAL_PACKAGE=$OUT_NAME" >> $GITHUB_ENV
          echo "RELEASE_TAG=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

      - name: Publish to GitHub Releases
        if: steps.download.outputs.has_update == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Panabit Standard (x86/Linux) - DPI Updated ${{ env.RELEASE_TAG }}
          body: |
            本 Release 由 GitHub Actions 自动构建，自动合并Panabit标准版（PanabitFREE）最新升级包与 DPI Linux amd64 特征包。

            - **系统架构**: `x86/Linux (amd64)`
            - **包含替换**:
              - `bin/dict.so`
              - `bin/dpi.so`

            <!-- 用于自动判断更新的签名信息，请勿修改下方文本 -->
            COMBINED_MD5:${{ steps.download.outputs.combined_md5 }}
          draft: false
          prerelease: false
          files: ${{ env.FINAL_PACKAGE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
