name: Panabit Auto Download, Repack & Release 04

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  repack-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y p7zip-full file

      - name: Download Files via Playwright Browser
        run: |
          python -c "
          import os, asyncio
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context(accept_downloads=True, ignore_https_errors=True)
                  page = await context.new_page()

                  # 1. 打开主程序下载页面
                  print('正在打开主程序下载页面...')
                  await page.goto('https://download.panabit.com:9443/?product=panabit', wait_until='networkidle')
                  
                  standard_tab = page.locator('text=标准版')
                  if await standard_tab.count() > 0:
                      await standard_tab.first.click()
                      await page.wait_for_timeout(1000)

                  download1_promise = page.wait_for_event('download')
                  btn1 = page.locator('div.paui-package-item:has(h6:has-text(\"PanabitFREE\")) button:has-text(\"立即下载\")')
                  await btn1.click()
                  
                  download1 = await download1_promise
                  orig_name1 = download1.suggested_filename
                  await download1.save_as('panabit_pkg.tar.gz')

                  # 2. 打开 DPI 特征包页面
                  print('正在打开 DPI 特征包页面...')
                  await page.goto('https://download.panabit.com:9443/dpi.php', wait_until='networkidle')

                  download2_promise = page.wait_for_event('download')
                  btn2 = page.locator('div.paui-package-item:has(h6:has-text(\"DPI_Linux\")):has(h6:has-text(\"amd64\")) button:has-text(\"立即下载\")')
                  await btn2.click()

                  download2 = await download2_promise
                  orig_name2 = download2.suggested_filename
                  await download2.save_as('dpi_pkg.pdb')

                  await browser.close()

                  # 3. 输出核对信息
                  size1 = os.path.getsize('panabit_pkg.tar.gz') / (1024 * 1024)
                  size2 = os.path.getsize('dpi_pkg.pdb') / 1024

                  print('\n' + '='*50)
                  print('【文件下载成功核对列表】')
                  print(f'1. 主程序包: {orig_name1} ({size1:.2f} MB) -> 已保存为 panabit_pkg.tar.gz')
                  print(f'2. DPI特征包: {orig_name2} ({size2:.2f} KB) -> 已保存为 dpi_pkg.pdb')
                  print('='*50 + '\n')

          asyncio.run(main())
          "

      - name: Unpack, Replace, and Repack
        run: |
          # 1. 静默获取主包内的根目录路径
          MAIN_DIR=$(tar -ztf panabit_pkg.tar.gz | head -n 1 | cut -d'/' -f1)
          echo "主包根目录名称: $MAIN_DIR"

          # 静默解压主包
          tar -zxf panabit_pkg.tar.gz

          # 2. 解压 .pdb 文件
          mkdir -p PDB_EXTRACTED
          7z x dpi_pkg.pdb -oPDB_EXTRACTED -y > /dev/null

          # 强力解决无后缀嵌套压缩包问题：遍历 PDB_EXTRACTED 中的所有文件，只要是 POSIX tar archive 就强制解压
          find PDB_EXTRACTED -type f | while read -r file; do
              if file "$file" | grep -q "tar archive"; then
                  echo "识别到 TAR 打包文件: $file，进行二次解压..."
                  tar -xf "$file" -C PDB_EXTRACTED/
              fi
          done

          # 3. 定位并替换 dict.so 和 dpi.so
          DICT_SRC=$(find PDB_EXTRACTED -name "dict.so" | head -n 1)
          DPI_SRC=$(find PDB_EXTRACTED -name "dpi.so" | head -n 1)

          if [ -z "$DICT_SRC" ] || [ -z "$DPI_SRC" ]; then
              echo "错误：未能在 PDB 中查找到 dict.so 或 dpi.so 文件！"
              echo "当前解压目录完整树形结构："
              find PDB_EXTRACTED
              exit 1
          fi

          echo "替换文件: $DICT_SRC -> $MAIN_DIR/bin/"
          cp -f "$DICT_SRC" "$MAIN_DIR/bin/"
          
          echo "替换文件: $DPI_SRC -> $MAIN_DIR/bin/"
          cp -f "$DPI_SRC" "$MAIN_DIR/bin/"

          # 4. 重新打包为 .tar.gz（加上 -q 静默日志）
          OUT_NAME="${MAIN_DIR}_DPI_Updated.tar.gz"
          tar -zcf "$OUT_NAME" "$MAIN_DIR"

          echo "FINAL_PACKAGE=$OUT_NAME" >> $GITHUB_ENV
          echo "RELEASE_TAG=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Panabit Repack Release ${{ env.RELEASE_TAG }}
          body: |
            自动合并 PanabitFREE 标准版主程序与最新 DPI Linux amd64 特征包。
            已覆盖二进制文件：
            - `bin/dict.so`
            - `bin/dpi.so`
          draft: false
          prerelease: false
          files: ${{ env.FINAL_PACKAGE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
